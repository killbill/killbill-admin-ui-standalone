name: release

on:
  workflow_dispatch:
    inputs:
      perform_version:
        description: 'tag to (re-)perform (in case of release:perform failure)'
        required: false
        default: ''
      target_version:
        description: 'Target version: next [major|minor|patch|pre|release] or a given version number [x.x.x]'
        required: true
        default: 'patch'

env:
  MAVEN_FLAGS: "-B --no-transfer-progress"
  MAVEN_OPTS: "-Xmx2G -XX:+ExitOnOutOfMemoryError -Dmaven.wagon.rto=60000 -Dmaven.wagon.httpconnectionManager.ttlSeconds=25 -Dmaven.wagon.http.retryHandler.count=3"

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        if: github.event.inputs.perform_version == ''
        uses: actions/checkout@v3
      - name: Checkout full repository
        # Required when performing an existing release.
        if: github.event.inputs.perform_version != ''
        uses: actions/checkout@v2
        with:
          fetch-depth: '0'
      - name: Setup git user
        env:
          BUILD_USER: ${{ secrets.BUILD_USER }}
          BUILD_TOKEN: ${{ secrets.BUILD_TOKEN }}
        run: |
          git config --global user.email "contact@killbill.io"
          git config --global user.name "Kill Bill core team"
          git config --global url."https://${BUILD_USER}:${BUILD_TOKEN}@github.com/".insteadOf "git@github.com:"
      - name: Configure Java
        uses: actions/setup-java@v2.5.0
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Configure Ruby
        # JRuby 9.4 (not 10): sorbet-runtime (via js-routes) hits a JRuby 10 parser
        # bug with Ruby 3.4's implicit block parameter `it`, breaking Rails boot.
        # The JDK (21) is what determines the universal-java platform in the lockfile.
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 'jruby-10.0.6.0'
          bundler-cache: false
      - name: Pin Maven to 3.9.16
        # Maven 3.10+ writes maven-metadata-local.xml/_remote.repositories into the central-publishing
        # staging directory, and Central Portal then rejects the bundle
        # ("Bundle has content that does NOT have a .pom file"). Remove once fixed upstream:
        # https://github.com/mavenplugins/central-publishing-maven-plugin/issues/79
        run: |
          wget -q https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz
          echo "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6  apache-maven-3.9.16-bin.tar.gz" | sha512sum -c -
          sudo tar xzf apache-maven-3.9.16-bin.tar.gz -C /opt
          echo "/opt/apache-maven-3.9.16/bin" >> "${GITHUB_PATH}"
          echo "MAVEN_HOME=/opt/apache-maven-3.9.16" >> "${GITHUB_ENV}"
          mvn -v
      - name: Download Java dependencies
        # We do as much as we can, but it may not be enough (https://issues.apache.org/jira/browse/MDEP-82)
        run: |
          mvn ${MAVEN_FLAGS} clean install dependency:resolve dependency:resolve-plugins -DskipTests=true -Dgpg.skip=true -Psonatype-oss-release
      - name: Configure settings.xml for release
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: temurin
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_SIGNING_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - name: Tag repository
        run: |
          bundle exec gem bump -c -p -v ${{ github.event.inputs.target_version }} -f lib/kaui_standalone/version.rb
      - name: Align Maven version with target
        # The Maven release version comes from pom.xml, not from target_version.
        # When an explicit x.x.x target is given, move the pom to <target>-SNAPSHOT
        # first so release:prepare releases the intended version.
        if: github.event.inputs.perform_version == ''
        run: |
          TARGET="${{ github.event.inputs.target_version }}"
          if [[ "$TARGET" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CURRENT=$(mvn ${MAVEN_FLAGS} help:evaluate -Dexpression=project.version -q -DforceStdout)
            if [[ "$CURRENT" != "$TARGET-SNAPSHOT" ]]; then
              mvn ${MAVEN_FLAGS} versions:set -DnewVersion="${TARGET}-SNAPSHOT" -DgenerateBackupPoms=false
              git add pom.xml
              git commit -m "Bump Maven version to ${TARGET}-SNAPSHOT"
              git push
            fi
          fi
      - name: Release artifacts
        if: github.event.inputs.perform_version == ''
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        # It will still check the remote but hopefully not download much (0 B at 0 B/s). -o isn't safe because of MDEP-82 (see above).
        run: |
          mvn ${MAVEN_FLAGS} release:clean release:prepare release:perform
      - name: Perform release
        if: github.event.inputs.perform_version != ''
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        # It will still check the remote but hopefully not download much (0 B at 0 B/s). -o isn't safe because of MDEP-82 (see above).
        # See https://issues.apache.org/jira/browse/SCM-729 for why the release.properties file is required.
        run: |
          echo "scm.url=scm\:git\:git@github.com\:${GITHUB_REPOSITORY}.git" > release.properties
          echo "scm.tag=${{ github.event.inputs.perform_version }}" >> release.properties
          mvn ${MAVEN_FLAGS} release:perform
