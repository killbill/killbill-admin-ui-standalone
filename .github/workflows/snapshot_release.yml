name: snapshot_release

on:
  workflow_dispatch:

env:
  MAVEN_OPTS: "-Xmx2G -XX:+ExitOnOutOfMemoryError -Dmaven.wagon.httpconnectionManager.ttlSeconds=25 -Dmaven.wagon.http.retryHandler.count=3"
  MAVEN_ARGS: -ntp

jobs:
  snapshot_release:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Configure Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 'jruby-10.0.6.0'
          bundler-cache: false
      - name: Configure Maven settings.xml profiles, repositories and pluginRepositories
        uses: s4u/maven-settings-action@v4.1.0
        with:
          githubServer: false
          # The "cloudsmith" server is referenced by <distributionManagement/> (see pom.xml) when uploading artifacts.
          # No "killbill-maven-repository" here: this project has no Kill Bill dependencies.
          servers: |
            [
              {"id": "central", "username": "token", "password": "${{ secrets.CLOUDSMITH_CENTRAL_PASSWORD }}", "repositoryOrigins": ["https://dl.cloudsmith.io"]},
              {"id": "cloudsmith", "username": "${{ secrets.CLOUDSMITH_DISTRIBUTION_MAN_USERNAME }}", "password": "${{ secrets.CLOUDSMITH_DISTRIBUTION_MAN_PASSWORD }}"}
            ]
          repositories: |
            [
              {
                "id": "central",
                "name": "Proxied Maven Central OSS repository at Cloudsmith",
                "url": "https://dl.cloudsmith.io/basic/killbill/oss/maven/",
                "releases": { "enabled": "true", "updatePolicy": "always" },
                "snapshots": { "enabled": "true", "updatePolicy": "always" }
              }
            ]
          pluginRepositories: |
            [
              {
                "id": "central",
                "name": "Proxied Maven Central OSS repository at Cloudsmith",
                "url": "https://dl.cloudsmith.io/basic/killbill/oss/maven/",
                "releases": { "enabled": "true", "updatePolicy": "always" },
                "snapshots": { "enabled": "true", "updatePolicy": "always" }
              }
            ]
      - name: Set up Maven
        # Pinned version needed. Otherwise, we will get surprised because GitHub Actions
        # updates the runner's pre-installed Maven version periodically.
        run: mvn --errors --batch-mode --show-version wrapper:wrapper "-Dmaven=3.10.0"
      - name: Set new version
        run: |
          current_version_with_snapshot=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          current_version_without_snapshot=${current_version_with_snapshot%SNAPSHOT*}
          snapshot_version="${current_version_without_snapshot}$(git rev-parse --short "$GITHUB_SHA")-SNAPSHOT"
          ./mvnw versions:set -DnewVersion=${snapshot_version}
          echo "::notice ::Version is ${snapshot_version}"
      - name: Deploy artifacts
        run: ./mvnw --errors --batch-mode --show-version -DskipTests=true deploy
