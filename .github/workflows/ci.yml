name: ci

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      purge-cache:
        description: Purge the existing Maven dependency cache (for this branch/ref) before restoring it
        required: false
        default: false
        type: boolean

env:
  COMPOSE_DOCKER_CLI_BUILD: 1
  DB_NAME: kaui_test
  DOCKER_BUILDKIT: 1
  JRUBY_OPTS: -J-Xmx1024M --debug
  KB_ADDRESS: 127.0.0.1
  KB_PORT: 8080
  RAILS_ENV: test

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - ruby-version: '3.2.2'
            database-adapter: 'mysql2'
            database-user: 'root'
            database-password: 'root'
            database-port: '3306'
            docker-compose-file: 'docker-compose.ci.mysql.yml'
          - ruby-version: 'jruby-10.0.6.0'
            database-adapter: 'mysql2'
            database-user: 'root'
            database-password: 'root'
            database-port: '3306'
            docker-compose-file: 'docker-compose.ci.mysql.yml'
          - ruby-version: '3.2.2'
            database-adapter: 'postgresql'
            database-user: 'postgres'
            database-password: 'postgres'
            database-port: '5432'
            docker-compose-file: 'docker-compose.ci.postgresql.yml'
          - ruby-version: 'jruby-10.0.6.0'
            database-adapter: 'postgresql'
            database-user: 'postgres'
            database-password: 'postgres'
            database-port: '5432'
            docker-compose-file: 'docker-compose.ci.postgresql.yml'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          #cache: 'maven'
      - name: Configure Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Start stack
        run: |
          cd docker
          docker compose -p it -f ${{ matrix.docker-compose-file }} up --no-start
          docker start it-db-1
      - name: Wait for MySQL
        if: ${{ matrix.docker-compose-file == 'docker-compose.ci.mysql.yml' }}
        run: |
          set +e
          count=0
          until mysqladmin ping -h 127.0.0.1 -u root --password=root --silent; do
            if [[ "$count" == "25" ]]; then
              exit 1
            fi
            (( count++ ))
            printf '.'
            sleep 5
          done
          set -e
      - name: Wait for PostgreSQL
        if: ${{ matrix.docker-compose-file == 'docker-compose.ci.postgresql.yml' }}
        run: |
          set +e
          count=0
          until $(psql -h 127.0.0.1 -U postgres -p 5432 -l > /dev/null); do
            if [[ "$count" == "25" ]]; then
              exit 1
            fi
            (( count++ ))
            printf '.'
            sleep 5
          done
          set -e
      - name: Start Kill Bill
        # Sometimes it gets stuck (if Kill Bill starts when the DB isn't ready?)
        timeout-minutes: 4
        run: |
          docker start it-killbill-1
          count=0
          until $(curl --connect-timeout 10 --max-time 30 --output /dev/null --silent --fail http://${KB_ADDRESS}:${KB_PORT}/1.0/healthcheck); do
            if [[ "$count" == "180" ]]; then
              exit 64
            fi
            count=$(( count + 1 ))
            sleep 1
          done
          curl --connect-timeout 10 --max-time 30 -v \
               -X POST \
               -u admin:password \
               -H 'Content-Type: application/json' \
               -H 'X-Killbill-CreatedBy: GitHub' \
               -d '{"apiKey": "bob", "apiSecret": "lazar"}' \
               "http://${KB_ADDRESS}:${KB_PORT}/1.0/kb/tenants"
      - name: Run tests
        env:
          DB_ADAPTER: ${{ matrix.database-adapter }}
          DB_USER: ${{ matrix.database-user }}
          DB_PASSWORD: ${{ matrix.database-password }}
          DB_PORT: ${{ matrix.database-port }}
        run: |
          # DB_URL (without the db name) is needed here or we get kaui_test database not found.
          # Must use the mysql: scheme: MySQL Connector/J (see Gemfile/config/database.yml) only
          # accepts jdbc:mysql://, not jdbc:mariadb://.
          DB_URL="jdbc:mysql://localhost:3306" bundle exec rails db:create
          bundle exec rails db:migrate
          # Some flakiness unfortunately
          ./bin/retry bundle exec rails t -w -f
      - name: Debugging after failure
        if: failure()
        run: |
          echo "[DEBUG] killbill healthcheck"
          curl --connect-timeout 10 --max-time 30 -v http://${KB_ADDRESS}:${KB_PORT}/1.0/healthcheck || true
          echo "[DEBUG] hostname"
          hostname
          echo "[DEBUG] netstat -tulpn"
          sudo netstat -tulpn
          echo "[DEBUG] docker network ls"
          docker network ls
          echo "[DEBUG] docker ps -a"
          docker ps -a
          echo "[DEBUG] killbill env"
          docker exec it-killbill-1 env || true
          echo "[DEBUG] db env"
          docker exec it-db-1 env || true
          echo "[DEBUG] killbill logs"
          docker logs -t --details it-killbill-1 || true
          echo "[DEBUG] db logs"
          docker logs -t --details it-db-1 || true

  build-war:
    runs-on: ubuntu-22.04
    env:
      MAVEN_ARGS: -ntp
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Configure Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 'jruby-10.0.6.0'
          bundler-cache: false
      - name: Purge Maven dependency cache
        if: inputs.purge-cache
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh cache list --key maven- --ref "${{ github.ref }}" --limit 100 --json id --jq '.[].id' \
            | xargs -r -n1 gh cache delete
      - name: Cache Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml', '**/.mvn/extensions.xml', '**/.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: |
            maven-${{ runner.os }}-
      - name: Configure Cloudsmith credentials
        uses: s4u/maven-settings-action@v4.1.0
        with:
          # Build only: "cloudsmith" (deploy-only server id) isn't needed. This project has no Kill Bill
          # dependencies, so "killbill-maven-repository" isn't needed either.
          githubServer: false
          servers: |
            [
              {"id": "central", "username": "token", "password": "${{ secrets.CLOUDSMITH_CENTRAL_PASSWORD }}", "repositoryOrigins": ["https://dl.cloudsmith.io"]}
            ]
          repositories: |
            [
              {
                "id": "central",
                "name": "Proxied Maven Central OSS repository at Cloudsmith",
                "url": "https://dl.cloudsmith.io/basic/killbill/oss/maven/",
                "releases": { "enabled": "true", "updatePolicy": "always" },
                "snapshots": { "enabled": "true", "updatePolicy": "always" }
              }
            ]
          pluginRepositories: |
            [
              {
                "id": "central",
                "name": "Proxied Maven Central OSS repository at Cloudsmith",
                "url": "https://dl.cloudsmith.io/basic/killbill/oss/maven/",
                "releases": { "enabled": "true", "updatePolicy": "always" },
                "snapshots": { "enabled": "true", "updatePolicy": "always" }
              }
            ]
      - name: Set up Maven
        # Pinned version needed. Otherwise, we will get surprised because GitHub Actions
        # updates the runner's pre-installed Maven version periodically.
        # distributionSha256Sum is the SHA-256 of apache-maven-3.10.0-bin.zip (the wrapper's default download).
        run: mvn --errors --batch-mode --show-version wrapper:wrapper "-Dmaven=3.10.0" "-DdistributionSha256Sum=1f6d9909266510f039f59aa0e13dcd2c66da85f043e56276e41f2918f8bddaff"
      - name: Build war
        run: |
          ./mvnw package
